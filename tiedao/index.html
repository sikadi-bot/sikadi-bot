<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#3a3a38">
<title>公开招募 · 铁道动漫社</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{
    --paper:rgba(236,236,232,.94);
    --paper2:rgba(246,246,243,.96);
    --ink:#1c1c1a;
    --ink2:#4e4e4a;
    --ink3:#8a8a84;
    --line:#c6c6c0;
    --blue:#4a90d9;
    --blue2:#2f6fb5;
    --gold:#c8a34a;
    --gold2:#a8852e;
    --cyan:#5fc9c0;
  }
  html,body{height:100%;}
  body{
    background:#2e2e2c;color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
    display:flex;justify-content:center;overflow-x:hidden;position:relative;
  }
  /* 虚化游戏背景 */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(circle at 22% 28%, rgba(150,160,170,.30), transparent 42%),
      radial-gradient(circle at 78% 18%, rgba(120,110,100,.32), transparent 40%),
      radial-gradient(circle at 62% 82%, rgba(90,100,110,.28), transparent 46%),
      radial-gradient(circle at 12% 86%, rgba(70,68,64,.35), transparent 44%),
      linear-gradient(160deg,#3c3c3a,#232322 70%);
    filter:blur(6px);
    transform:scale(1.06);
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px);
  }

  .app{
    width:100%;max-width:470px;position:relative;z-index:2;
    padding:0 10px calc(14px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;min-height:100vh;
  }

  /* ═══ 顶栏（官方 HUD） ═══ */
  .topbar{
    display:flex;align-items:center;gap:9px;
    padding:12px 2px 10px;position:relative;
  }
  .ibtn{
    width:30px;height:30px;display:grid;place-items:center;
    background:rgba(20,20,18,.72);color:#e8e8e4;
    font-size:14px;line-height:1;flex:0 0 auto;
    border:1px solid rgba(255,255,255,.12);
  }
  .ibtn.hex{font-size:11px;letter-spacing:0;color:#cfcfca;}
  .res{
    margin-left:auto;display:flex;align-items:center;gap:10px;
    font-family:ui-monospace,Consolas,monospace;font-size:10.5px;
    color:#f0f0ec;letter-spacing:.02em;
  }
  .res span{display:flex;align-items:center;gap:3px;}
  .res .txt{display:flex;flex-direction:column;line-height:1.15;align-items:flex-start;}
  .res b{font-weight:600;font-size:10px;letter-spacing:.01em;}
  .res em{
    font-style:normal;font-size:6.5px;color:rgba(255,255,255,.52);
    letter-spacing:.02em;white-space:nowrap;
  }
  .res .ic{width:16px;height:16px;flex:0 0 auto;display:block;}

  .luckbar{
    display:flex;align-items:center;gap:7px;
    font-size:9.5px;color:#e0e0da;margin-bottom:8px;padding:0 2px;
  }
  .luckbar .t{
    display:flex;align-items:center;gap:4px;
    background:rgba(74,144,217,.85);padding:2.5px 7px;color:#fff;
    font-family:ui-monospace,Consolas,monospace;
  }
  .luckbar .bar{
    flex:1;height:5px;background:rgba(255,255,255,.22);position:relative;overflow:hidden;
  }
  .luckbar .bar::after{
    content:"";position:absolute;inset:0;width:100%;
    background:linear-gradient(90deg,#8fc4f0,#4a90d9);
  }
  .luckbar .cap{font-size:9px;color:#cfcfc8;}

  /* ═══ 主面板 ═══ */
  .panel{
    background:var(--paper);
    border:1px solid rgba(255,255,255,.5);
    box-shadow:0 6px 22px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.7);
    padding:0 0 0;
    position:relative;
  }
  .note{
    position:absolute;left:0;top:-1px;transform:translateY(-100%);
    background:#1e1e1c;color:#f0f0ec;font-size:10px;
    padding:5px 10px;letter-spacing:.06em;
    display:flex;align-items:center;gap:5px;
  }
  .note::after{
    content:"";position:absolute;right:-6px;top:0;
    border-left:6px solid #1e1e1c;border-bottom:11px solid transparent;
  }

  .row{
    display:flex;align-items:center;gap:12px;
    padding:15px 14px;border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:0;}
  .rl{
    width:66px;flex:0 0 auto;font-size:12.5px;font-weight:600;
    color:var(--ink);line-height:1.5;
  }
  .rl small{display:block;font-size:9.5px;font-weight:400;color:var(--ink3);letter-spacing:.02em;}
  .rc{flex:1;min-width:0;}

  /* ── 时间 ── */
  .timewrap{display:flex;flex-direction:column;align-items:center;}
  .arow{display:flex;gap:34px;}
  .tbtn{
    width:56px;height:19px;display:grid;place-items:center;
    background:#e2e2dd;border:1px solid #bdbdb6;color:#3a3a36;
    font-size:9px;cursor:pointer;font-family:inherit;
  }
  .tbtn:active{background:#d0d0c9;}
  .tbtn:disabled{opacity:.35;}
  .tdigits{
    font-family:ui-monospace,Consolas,monospace;
    font-size:31px;font-weight:700;letter-spacing:.01em;
    color:#141412;line-height:1.15;margin:2px 0;
    font-variant-numeric:tabular-nums;
  }
  .tdigits span{opacity:.28;}

  .possible{
    display:flex;flex-direction:column;gap:4px;align-items:flex-start;
  }
  .possible .p{
    font-size:9.5px;color:var(--ink3);letter-spacing:.02em;
  }
  .stars{
    display:flex;flex-wrap:wrap;gap:3px;max-width:112px;
  }
  .sbox{
    font-size:10px;font-family:ui-monospace,Consolas,monospace;
    background:var(--blue);color:#fff;padding:2px 5px;line-height:1.3;
  }
  .sbox.dim{background:#b8b8b2;}
  .sbox.gold{background:var(--gold);color:#2a2000;}

  /* ── 职业需求 ── */
  .taggrid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  }
  .tg{
    height:36px;display:grid;place-items:center;
    background:#1e1e1c;color:#f2f2ee;
    font-size:11.5px;font-weight:500;letter-spacing:.02em;
    border:1px solid #1e1e1c;cursor:pointer;
    padding:0 2px;text-align:center;line-height:1.2;
    transition:background .15s,color .15s,box-shadow .15s;
    position:relative;overflow:hidden;
  }
  .tg.rare{background:var(--gold);color:#241d00;border-color:var(--gold2);}
  .tg.empty{background:#d4d4ce;border-color:#c6c6c0;cursor:default;}
  .tg.sel{box-shadow:inset 0 0 0 2px #fff,0 0 0 2px var(--blue);}
  .tg.sel::after{
    content:"✓";position:absolute;right:3px;top:1px;font-size:8px;color:#fff;
    text-shadow:0 0 3px rgba(0,0,0,.6);
  }
  .tg.rare.sel::after{color:#241d00;text-shadow:none;}
  .tg.cut{
    background:#8e8e88!important;color:#d8d8d2!important;border-color:#8e8e88!important;
    box-shadow:none!important;
  }
  .tg.cut::before{
    content:"";position:absolute;left:-2%;top:50%;height:2px;background:#c0403a;
    width:0;animation:strike .3s forwards;z-index:2;
    box-shadow:0 0 4px rgba(192,64,58,.8);
  }
  .tg.cut::after{display:none;}
  @keyframes strike{to{width:104%;}}

  .refreshcol{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    width:52px;flex:0 0 auto;
  }
  .refreshbtn{
    width:40px;height:40px;border-radius:50%;
    background:var(--cyan);border:2px solid #fff;
    color:#0d3b38;font-size:17px;display:grid;place-items:center;
    cursor:pointer;font-family:inherit;
    box-shadow:0 2px 6px rgba(0,0,0,.2);
  }
  .refreshbtn:active{transform:rotate(90deg);}
  .refreshbtn:disabled{background:#b8b8b2;color:#e0e0da;cursor:default;}
  .refreshcol .cap{font-size:8.5px;color:var(--blue);letter-spacing:0;}

  /* ── 预算 ── */
  .budget{
    display:flex;align-items:center;gap:10px;
  }
  .permit{
    width:42px;height:52px;background:#1e1e1c;flex:0 0 auto;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#f0f0ec;font-size:7px;letter-spacing:.04em;gap:2px;
    position:relative;
  }
  .permit::before{
    content:"";position:absolute;inset:3px;border:1px solid rgba(255,255,255,.35);
  }
  .permit .n{font-family:ui-monospace,Consolas,monospace;font-size:12px;font-weight:700;}
  .cost{
    flex:1;font-family:ui-monospace,Consolas,monospace;
    font-size:11.5px;color:var(--ink2);line-height:1.7;
  }
  .cost b{color:var(--ink);font-size:13px;}
  .okwrap{display:flex;flex-direction:column;gap:6px;}
  .obtn{
    width:46px;height:30px;display:grid;place-items:center;
    color:#fff;font-size:14px;cursor:pointer;border:0;font-family:inherit;
    background:#1e1e1c;
  }
  .obtn.y{background:var(--blue);}
  .obtn.y:disabled{background:#a8a8a2;cursor:default;}
  .obtn:active{filter:brightness(1.1);}

  .footnote{
    margin-top:auto;padding:14px 0 4px;text-align:center;
    font-family:ui-monospace,Consolas,monospace;font-size:8px;
    color:rgba(255,255,255,.4);letter-spacing:.16em;line-height:1.9;
  }

  /* ═══════════════ 结果屏（干员展示） ═══════════════ */
  #result{
    display:none;position:fixed;inset:0;z-index:50;
    background:#141412;overflow:hidden;flex-direction:column;
    align-items:center;
  }
  #result.on{display:flex;}
  #result::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 34%, rgba(210,200,170,.22), transparent 68%),
      radial-gradient(ellipse 90% 40% at 50% 100%, rgba(120,110,90,.24), transparent 70%),
      linear-gradient(190deg,#22221f,#0c0c0b 62%);
  }
  #result::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);
    mix-blend-mode:multiply;
  }

  .rhead{
    position:relative;z-index:2;width:100%;padding:16px 18px 0;
    display:flex;justify-content:space-between;
    font-family:ui-monospace,Consolas,monospace;font-size:8px;
    letter-spacing:.28em;color:rgba(255,255,255,.42);
  }

  .art{
    position:relative;z-index:2;flex:1;width:100%;max-width:430px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:6px 18px 0;min-height:0;
  }

  /* 梗图 / 立绘位 */
  .meme{
    width:100%;max-width:300px;aspect-ratio:4/3;
    display:flex;align-items:center;justify-content:center;
    position:relative;margin-bottom:2px;
  }
  .meme img{
    max-width:100%;max-height:100%;object-fit:contain;
    filter:drop-shadow(0 8px 26px rgba(0,0,0,.6));
  }
  /* 干员档案剪影卡（没有真图时顶替） */
  .silcard{
    width:100%;height:100%;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#1c1c19,#080807);
    border:1px solid rgba(255,255,255,.16);
    display:flex;align-items:flex-end;justify-content:center;
    box-shadow:0 10px 34px rgba(0,0,0,.55),inset 0 0 46px rgba(0,0,0,.65);
  }
  .silcard .corner{position:absolute;width:13px;height:13px;border:1px solid rgba(255,255,255,.38);}
  .silcard .corner.tl{left:6px;top:6px;border-right:0;border-bottom:0;}
  .silcard .corner.tr{right:6px;top:6px;border-left:0;border-bottom:0;}
  .silcard .corner.bl{left:6px;bottom:6px;border-right:0;border-top:0;}
  .silcard .corner.br{right:6px;bottom:6px;border-left:0;border-top:0;}
  .silcard .scanline{
    position:absolute;left:0;right:0;height:32%;top:-32%;
    background:linear-gradient(180deg,transparent,rgba(255,255,255,.06),transparent);
    animation:scanmove 3s linear infinite;
  }
  @keyframes scanmove{to{top:100%;}}
  .silcard svg{width:100%;height:100%;display:block;}
  .silcard .tagline{
    position:absolute;left:9px;top:9px;z-index:2;
    font-family:ui-monospace,Consolas,monospace;font-size:6px;
    letter-spacing:.26em;color:rgba(255,255,255,.36);
  }

  /* 星星（底部大白星） */
  .bigstars{
    position:relative;z-index:3;display:flex;gap:2px;
    margin-top:2px;filter:drop-shadow(0 0 14px rgba(255,255,255,.5));
  }
  .bs{
    width:30px;height:30px;position:relative;
    opacity:0;transform:scale(.4);
  }
  .bs.on{animation:bspop .46s cubic-bezier(.2,1.4,.4,1) forwards;}
  .bs svg{width:100%;height:100%;display:block;}
  .bs path{fill:#f2f0e8;stroke:#14140f;stroke-width:1.4;}
  .bs.six path{fill:#ffe9a8;stroke:#8a6d1e;}
  @keyframes bspop{
    0%{opacity:0;transform:scale(.4) rotate(-20deg)}
    60%{opacity:1;transform:scale(1.24) rotate(4deg)}
    100%{opacity:1;transform:scale(1) rotate(0)}
  }

  .gname{
    position:relative;z-index:3;text-align:center;margin-top:9px;
  }
  .gname .cn{
    font-size:24px;font-weight:800;color:#f6f4ec;letter-spacing:.14em;
    line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.8);
  }
  .gname .en{
    font-family:ui-monospace,Consolas,monospace;font-size:9px;
    letter-spacing:.34em;color:rgba(255,255,255,.45);margin-top:7px;
  }
  .gname .new{
    display:inline-block;margin-top:7px;background:#c8452e;color:#fff;
    font-family:ui-monospace,Consolas,monospace;font-size:8px;
    letter-spacing:.24em;padding:2.5px 8px;
  }
  .gname .new.old{background:#4a4a44;}

  .quote{
    position:relative;z-index:3;width:100%;padding:0 20px;
    text-align:center;font-size:11.5px;line-height:1.85;
    color:rgba(255,255,255,.62);margin:10px 0 4px;
    min-height:42px;
  }

  .rfoot{
    position:relative;z-index:3;width:100%;max-width:430px;
    padding:0 18px 20px;
    display:flex;flex-direction:column;align-items:center;gap:9px;
  }
  .rankrow{
    font-family:ui-monospace,Consolas,monospace;font-size:9px;
    letter-spacing:.3em;color:rgba(255,255,255,.5);
  }
  .rankrow b{color:#ffe9a8;}
  .joinbox{
    width:100%;display:flex;align-items:center;gap:11px;
    background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);
    padding:9px 11px;
  }
  .joinbox .qr{
    width:62px;height:62px;background:#fff;padding:3px;flex:0 0 auto;
  }
  .joinbox .qr img{width:100%;height:100%;display:block;image-rendering:pixelated;}
  .joinbox .jt{flex:1;min-width:0;}
  .joinbox .jt .a{font-size:12px;font-weight:700;color:#f6f4ec;letter-spacing:.06em;}
  .joinbox .jt .b{
    font-size:9.5px;color:rgba(255,255,255,.46);margin-top:3px;
    font-family:ui-monospace,Consolas,monospace;letter-spacing:.04em;
  }
  .joinbox .jt .c{font-size:9.5px;color:#7fd4cb;margin-top:2px;letter-spacing:.02em;}

  .rbtns{display:flex;gap:8px;width:100%;}
  .rbtn{
    flex:1;padding:10px;background:transparent;
    border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.78);
    font-size:11px;letter-spacing:.14em;font-family:inherit;cursor:pointer;
  }
  .rbtn:active{background:rgba(255,255,255,.1);}
  .rbtn.pri{background:rgba(74,144,217,.9);border-color:transparent;color:#fff;}

  /* 扫描遮罩 */
  .scanmask{
    position:fixed;inset:0;z-index:60;display:none;
    background:rgba(10,10,9,.9);backdrop-filter:blur(3px);
    align-items:center;justify-content:center;flex-direction:column;
  }
  .scanmask.on{display:flex;animation:fadeIn .16s;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .spin{
    width:74px;height:74px;border:2px solid rgba(95,201,192,.25);
    border-top-color:var(--cyan);border-radius:50%;
    animation:sp .8s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  .scantext{
    margin-top:22px;font-family:ui-monospace,Consolas,monospace;
    font-size:9.5px;letter-spacing:.4em;color:var(--cyan);
    animation:blink 1.1s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  .flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:70;}
  .flash.go{animation:fl .55s ease-out;}
  @keyframes fl{0%{opacity:0}12%{opacity:.92}100%{opacity:0}}

  .toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(14px);
    background:#f2f0e8;color:#14140f;font-size:11.5px;font-weight:700;
    padding:9px 20px;letter-spacing:.1em;opacity:0;transition:.24s;z-index:100;
    pointer-events:none;white-space:nowrap;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="app" id="recruit">

  <!-- 顶栏 -->
  <div class="topbar">
    <div class="ibtn">‹</div>
    <div class="ibtn hex">✦</div>
    <div class="ibtn">i</div>
    <div class="res">
      <span>
        <svg class="ic" viewBox="0 0 24 24"><defs>
          <linearGradient id="ic1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#a8e0ff"/><stop offset=".45" stop-color="#4aa3e8"/>
            <stop offset="1" stop-color="#1b4f8a"/></linearGradient></defs>
          <path d="M12 1.6 21.2 9 12 22.4 2.8 9z" fill="url(#ic1)" stroke="#d6f0ff" stroke-width=".9"/>
          <path d="M12 1.6 15.6 9 12 22.4 8.4 9z" fill="#fff" opacity=".28"/>
          <path d="M2.8 9h18.4" stroke="#fff" stroke-width=".7" opacity=".45"/>
        </svg>
        <span class="txt"><b>896596</b><em>源石</em></span>
      </span>
      <span>
        <svg class="ic" viewBox="0 0 24 24"><defs>
          <linearGradient id="ic2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f2f2ee"/><stop offset=".5" stop-color="#c8c8c2"/>
            <stop offset="1" stop-color="#8a8a84"/></linearGradient></defs>
          <rect x="2.6" y="2.6" width="18.8" height="18.8" rx="3.2" fill="url(#ic2)" stroke="#fff" stroke-width=".9"/>
          <rect x="6.4" y="6.4" width="11.2" height="11.2" rx="1.6" fill="none" stroke="#6e6e68" stroke-width="1.5"/>
          <path d="M9.6 12h4.8M12 9.6v4.8" stroke="#6e6e68" stroke-width="1.5" opacity=".55"/>
        </svg>
        <span class="txt"><b>299</b><em>龙门币</em></span>
      </span>
      <span>
        <svg class="ic" viewBox="0 0 24 24"><defs>
          <radialGradient id="ic3" cx="34%" cy="28%" r="76%">
            <stop offset="0" stop-color="#fffbe0"/><stop offset=".38" stop-color="#f0d95e"/>
            <stop offset=".78" stop-color="#c9a92c"/><stop offset="1" stop-color="#8a6f12"/></radialGradient></defs>
          <circle cx="12" cy="12" r="9.6" fill="url(#ic3)"/>
          <ellipse cx="8.8" cy="7.8" rx="3.2" ry="2.2" fill="#fff" opacity=".62" transform="rotate(-24 8.8 7.8)"/>
          <circle cx="17.4" cy="16.6" r="1.5" fill="#fff" opacity=".22"/>
        </svg>
        <span class="txt"><b>20880</b><em>合成玉</em></span>
      </span>
      <span>
        <svg class="ic" viewBox="0 0 24 24"><defs>
          <linearGradient id="ic4" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ff9a86"/><stop offset=".5" stop-color="#d9503c"/>
            <stop offset="1" stop-color="#8e2418"/></linearGradient></defs>
          <rect x="2.6" y="4.6" width="18.8" height="14.8" rx="2.2" fill="url(#ic4)" stroke="#ffc4b8" stroke-width=".9"/>
          <path d="M6.2 9.4h11.6M6.2 12h11.6M6.2 14.6h7.4" stroke="#4a0f08" stroke-width="1.4" opacity=".42"/>
        </svg>
        <span class="txt"><b>54852</b><em>源石锭</em></span>
      </span>
    </div>
  </div>

  <div class="luckbar">
    <span class="t">◈ 联络次数 <span id="rfTxt">3/3</span></span>
    <div class="bar"></div>
    <span class="cap">人脉联络已达上限</span>
  </div>

  <!-- 主面板 -->

<script>
/* ══════ 标签池 ══════ */
const POOL = [
  {t:'先锋干员',r:0,w:8},{t:'狙击干员',r:0,w:8},{t:'医疗干员',r:0,w:8},
  {t:'术师干员',r:0,w:8},{t:'近卫干员',r:0,w:8},{t:'重装干员',r:0,w:8},
  {t:'辅助干员',r:0,w:7},
  {t:'近战位',r:0,w:10},{t:'远程位',r:0,w:10},
  {t:'输出',r:0,w:10},{t:'群攻',r:0,w:8},{t:'治疗',r:0,w:7},
  {t:'生存',r:0,w:7},{t:'防护',r:0,w:7},{t:'减速',r:0,w:6},{t:'费用回复',r:0,w:6},
  {t:'特种干员',r:1,w:3},{t:'支援',r:1,w:3},{t:'削弱',r:1,w:3},
  {t:'位移',r:1,w:2.5},{t:'控场',r:1,w:2.5},{t:'爆发',r:1,w:2},
  {t:'召唤',r:1,w:2},{t:'快速复活',r:1,w:2.5},
  {t:'资深干员',r:2,w:6},
  {t:'高级资深干员',r:3,w:3.5}
];
const MID_RARE = ['爆发','召唤','控场','削弱','位移','支援','快速复活','特种干员'];

/* 冲突标签对：必定划掉一项 */
const CONFLICT = [
  ['近战位','远程位'],['先锋干员','术师干员'],['医疗干员','近卫干员'],
  ['狙击干员','重装干员'],['输出','防护'],['生存','治疗']
];

let tags = [], slots = [null,null,null,null,null,null], sel = new Set();
let minutes = 60, busy = false, refreshLeft = 3;
const MIN = 60, MAX = 540;

/* ══════ 音效 ══════ */
let ac = null;
function tone(f, d, type='sine', vol=.035, to=null){
  try{
    if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
    const t0 = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if(to) o.frequency.exponentialRampToValueAtTime(to, t0+d);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(.0001, t0+d);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0+d+.02);
  }catch(e){}
}

/* ══════ 抽标签 ══════ */
function rollTags(){
  const out = [], used = new Set();
  while(out.length < 5){
    const total = POOL.filter(p=>!used.has(p.t)).reduce((s,p)=>s+p.w,0);
    let x = Math.random()*total;
    for(const p of POOL){
      if(used.has(p.t)) continue;
      x -= p.w;
      if(x <= 0){ out.push({...p,cut:false}); used.add(p.t); break; }
    }
  }
  return out;
}

/* ══════ 渲染 6 格 ══════ */
function renderTags(){
  const box = document.getElementById('tags');
  box.innerHTML = '';
  for(let i=0;i<6;i++){
    const d = document.createElement('div');
    const tg = tags[i];
    if(!tg){
      d.className = 'tg empty';
      d.textContent = '';
    }else{
      d.className = 'tg' + (tg.r>=2 ? ' rare' : '') + (sel.has(i) ? ' sel' : '');
      d.textContent = tg.t;
      d.dataset.i = i;
      d.addEventListener('click', ()=>toggle(i, d));
    }
    box.appendChild(d);
  }
  updateUI();
}

function toggle(i, el){
  if(busy) return;
  if(sel.has(i)){ sel.delete(i); el.classList.remove('sel'); }
  else{
    if(sel.size >= 3){ shake(el); return; }
    sel.add(i); el.classList.add('sel');
  }
  tone(sel.has(i)?900:520, .055, 'square', .022);
  updateUI();
}

function shake(el){
  el.animate([{transform:'translateX(0)'},{transform:'translateX(-4px)'},
              {transform:'translateX(4px)'},{transform:'translateX(0)'}],{duration:160});
  tone(170,.08,'square',.026);
}

/* ══════ 时间 ══════ */
function drawTime(){
  const h = Math.floor(minutes/60), m = minutes%60;
  document.getElementById('tdigits').innerHTML =
    String(h).padStart(2,'0') + '<span>:</span>' +
    String(m).padStart(2,'0') + '<span>:</span>00';

  /* 龙门币：1小时2000，之后每10分钟递增 */
  let lmb;
  if(minutes <= 240) lmb = 2000 + (minutes-60)/10 * 300;
  else lmb = 2000 + 18*300 + (minutes-240)/10 * 400;
  lmb = Math.round(lmb + sel.size * 800);
  document.getElementById('lmb').textContent = lmb.toLocaleString();

  /* 可获得星级 */
  let lo, hi;
  if(minutes >= 460){ lo=3; hi=6; }
  else if(minutes >= 240){ lo=2; hi=5; }
  else { lo=1; hi=4; }
  const sr = document.getElementById('starRange');
  sr.innerHTML = '';
  for(let s=1;s<=6;s++){
    const b = document.createElement('span');
    b.className = 'sbox' + (s<lo||s>hi ? ' dim' : (s>=5?' gold':''));
    b.textContent = s + '★';
    sr.appendChild(b);
  }

  document.getElementById('hUp').disabled = minutes >= MAX;
  document.getElementById('hDn').disabled = minutes <= MIN;
  document.getElementById('mUp').disabled = minutes >= MAX;
  document.getElementById('mDn').disabled = minutes <= MIN;

  document.getElementById('rTime').textContent =
    String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}

function setMin(v){
  v = Math.max(MIN, Math.min(MAX, Math.round(v/10)*10));
  if(v===minutes) return;
  minutes = v; drawTime();
}

document.getElementById('hUp').onclick = ()=>{ if(!busy) { setMin(Math.floor(minutes/60)*60+60); tone(900,.03,'sine',.016);} };
document.getElementById('hDn').onclick = ()=>{ if(!busy) { setMin(Math.floor(minutes/60)*60-60); tone(760,.03,'sine',.016);} };
document.getElementById('mUp').onclick = ()=>{ if(!busy) { setMin(minutes+10); tone(940,.03,'sine',.016);} };
document.getElementById('mDn').onclick = ()=>{ if(!busy) { setMin(minutes-10); tone(720,.03,'sine',.016);} };

/* ══════ 刷新 ══════ */
document.getElementById('refresh').onclick = ()=>{
  if(busy || refreshLeft<=0) return;
  refreshLeft--;
  tags = rollTags(); sel = new Set();
  renderTags();
  document.getElementById('rfTxt').textContent = refreshLeft + '/3';
  if(refreshLeft<=0) document.getElementById('refresh').disabled = true;
  tone(620,.07,'square',.024);
};

/* ══════ 取消 ══════ */
document.getElementById('cancel').onclick = ()=>{
  if(busy) return;
  sel = new Set();
  renderTags();
  tone(300,.07,'square',.02);
};

function updateUI(){
  document.getElementById('go').disabled = sel.size===0 || busy;
  document.getElementById('footn').textContent =
    sel.size===0 ? '请选择招募需求（最多3项）' : '已选 '+sel.size+' 项';
  drawTime();
}

/* ══════ 划标签概率 ══════ */
function cutChance(){
  const m = minutes;
  if(m<=60) return .52;
  if(m<=240) return .52 - (m-60)/180*.24;
  if(m<=460) return .28 - (m-240)/220*.18;
  return .10 - (m-460)/80*.07;
}

/* ══════ 开始 ══════ */
document.getElementById('go').onclick = start;

async function start(){
  if(busy || sel.size===0) return;
  busy = true;
  document.getElementById('go').disabled = true;
  document.getElementById('footn').textContent = '联络中…';

  const mask = document.getElementById('scanmask');
  const st = document.getElementById('scantext');
  mask.classList.add('on');
  tone(420,.16,'sine',.03,760);
  await wait(380);
  st.textContent = 'MATCHING';

  const chosen = [...sel];
  const base = cutChance();

  /* 冲突标签：必定划掉一项 */
  let forcedCut = null;
  for(const [a,b] of CONFLICT){
    const ia = chosen.find(i=>tags[i] && tags[i].t===a);
    const ib = chosen.find(i=>tags[i] && tags[i].t===b);
    if(ia!==undefined && ib!==undefined){
      forcedCut = Math.random()<.5 ? ia : ib;
      break;
    }
  }

  for(const i of chosen){
    const tg = tags[i];
    const el = document.querySelector(`.tg[data-i="${i}"]`);
    let p = base * (tg.r===0?1.15:tg.r===1?.9:tg.r===2?.55:1);
    if(tg.r===3 && minutes>=540) p = 0;
    if(forcedCut===i) p = 1;

    const cut = Math.random() < p;
    tg.cut = cut;

    await wait(210);
    if(cut){
      el.classList.add('cut');
      tone(200,.17,'sawtooth',.026,80);
    }else{
      el.animate([{transform:'scale(1)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:220});
      tone(1400,.04,'sine',.02);
    }
    await wait(220);
  }

  st.textContent = 'COMPLETE';
  await wait(320);
  mask.classList.remove('on');
  showResult();
}
const wait = ms => new Promise(r=>setTimeout(r,ms));

/* ══════ 判定 ══════ */
function judge(){
  const kept = tags.filter((t,i)=>sel.has(i) && !t.cut);
  const names = kept.map(t=>t.t);

  if(names.includes('高级资深干员')) return {star:6, kept, names};
  if(names.includes('资深干员'))     return {star:5, kept, names};

  let sc = 0;
  MID_RARE.forEach(n=>{ if(names.includes(n)) sc++; });
  if(kept.length>=2) sc++;
  if(minutes>=460) sc++;

  let star = 2;
  if(sc>=4) star=5; else if(sc>=2) star=4; else if(sc>=1) star=3;
  return {star, kept, names};
}

/* ══════ 梗（按星级） ══════ */
const MEMES = {
  2:{title:'叽里咕噜',big:'叽里咕噜<br><em>说什么呢</em>',sm:'你说什么，我没听懂',
     quote:'标签被划完了。<br>下次把时间拉满，标签基本不会被划。'},
  3:{title:'草木',big:'你踩草木<br><em>我草你木</em>',sm:'（小车式佛系）',
     quote:'及格。至少你点了开始招募。<br>很多人连点都没点就走了。'},
  4:{title:'硬脚',big:'硬脚网络<br><em>牛逼</em>',sm:'不知道为啥，但很猛',
     quote:'这个组合不多见。<br>你选标签的时候有点想法。'},
  5:{title:'血狼',big:'管理员<br><em>要进行杯级评估吗？</em>',sm:'—— 血狼破军',
     quote:'五星。这种标签一年也出不了几个。<br>你今天手气不错。'},
  6:{title:'HR',big:'HUMAN SOURCE<br><em>DEPARTMENT</em>',sm:'人事部，燃起来了',
     quote:'高级资深干员。<br>这种运气，一年也碰不上几次。'}
};
const GNAMES = {
  2:['观望者','Observer'],3:['候补生','Reserve'],4:['在册者','Enlisted'],
  5:['资深者','Veteran'],6:['人事部之影','Shadow of HR']
};
const RANKTXT = {2:'RANK · D',3:'RANK · C',4:'RANK · B',5:'RANK · A',6:'RANK · S'};

function starSVG(six){
  return `<svg viewBox="0 0 24 24"><path d="M12 2.2l2.9 6.3 6.9.7-5.1 4.7 1.4 6.8L12 17.4 5.9 20.7l1.4-6.8L2.2 9.2l6.9-.7z"${six?' class="six"':''}/></svg>`;
}

/* ══════ 档案剪影（没有真立绘时顶替） ══════ */
function silCard(star){
  const gold = star >= 5;
  const c = gold ? '#e8c86a' : '#7fcfc6';
  return `<div class="silcard">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div class="tagline">PERSONNEL FILE</div>
    <div class="scanline"></div>
    <svg viewBox="0 0 240 180" preserveAspectRatio="xMidYMax meet">
      <defs>
        <radialGradient id="gl${star}" cx="50%" cy="44%" r="60%">
          <stop offset="0%" stop-color="${c}" stop-opacity=".45"/>
          <stop offset="65%" stop-color="${c}" stop-opacity=".07"/>
          <stop offset="100%" stop-color="${c}" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="bd${star}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3a3a33"/>
          <stop offset="100%" stop-color="#0b0b09"/>
        </linearGradient>
      </defs>
      <ellipse cx="120" cy="88" rx="106" ry="88" fill="url(#gl${star})"/>
      <g fill="url(#bd${star})" stroke="${c}" stroke-width="1" stroke-opacity=".7">
        <circle cx="120" cy="52" r="18"/>
        <path d="M120 74c-24 0-39 17-45 41l-9 63h108l-9-63c-6-24-21-41-45-41z"/>
        <path d="M79 97c-12 9-18 28-16 50l5 29h8l-3-32z"/>
        <path d="M161 97c12 9 18 28 16 50l-5 29h-8l3-32z"/>
      </g>
      <path d="M120 32l3.2 7 7.7.7-5.8 5.2 1.6 7.6-6.7-3.7-6.7 3.7 1.6-7.6-5.8-5.2 7.7-.7z"
            fill="${c}" fill-opacity=".5"/>
    </svg>
  </div>`;
}

function showResult(){
  const {star, kept, names} = judge();
  const R = document.getElementById('result');
  R.classList.add('on');
  window.scrollTo(0,0);

  /* 立绘位：有图用图，没图用档案剪影 */
  const m = MEMES[star];
  const memeBox = document.getElementById('meme');
  memeBox.innerHTML = silCard(star);
  const real = new Image();
  real.alt = '';
  real.onload = () => {
    const s = memeBox.querySelector('.silcard');
    if(s) s.style.display = 'none';
    real.style.maxWidth = '100%';
    real.style.maxHeight = '100%';
    real.style.objectFit = 'contain';
    real.style.filter = 'drop-shadow(0 8px 26px rgba(0,0,0,.6))';
    memeBox.appendChild(real);
  };
  real.src = 'images/' + star + '.png';

  /* 星星 */
  const bs = document.getElementById('bigstars');
  bs.innerHTML = '';
  for(let i=0;i<star;i++){
    const d = document.createElement('div');
    d.className = 'bs' + (star===6?' six':'');
    d.innerHTML = starSVG(star===6);
    bs.appendChild(d);
  }
  bs.style.gap = star>=5 ? '1px' : '3px';
  [...bs.children].forEach((el,i)=>{
    setTimeout(()=>{
      el.classList.add('on');
      tone(540+i*100,.1,'triangle',.03);
    }, 300 + i*170);
  });

  /* 名字 */
  const [cn,en] = GNAMES[star];
  document.getElementById('gcn').textContent = cn;
  document.getElementById('gen').textContent = 'No.' + String(Math.floor(Math.random()*9000)+1000);
  document.getElementById('quote').innerHTML = m.quote;
  document.getElementById('rankrow').innerHTML = RANKTXT[star] + '　保留 ' + (names.length?names.join(' / '):'无');

  /* 六星：闪白 */
  if(star>=6){
    setTimeout(()=>{
      const f = document.getElementById('flash');
      f.classList.add('go');
      setTimeout(()=>f.classList.remove('go'),600);
      [0,120,250,420].forEach((d,k)=>setTimeout(()=>tone(880+k*170,.4,'triangle',.032),d));
    }, 780);
  }

  document.getElementById('copy').dataset.txt =
    `【公开招募】${'★'.repeat(star)}${'☆'.repeat(6-star)}  ` +
    `保留：${names.join(' / ')||'无'}　时长：${fmt(minutes)}`;
  document.getElementById('footn').textContent = '招募完成';
  busy = false;
}

function fmt(m){ return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }

/* ══════ 再来一次 ══════ */
document.getElementById('again').onclick = ()=>{
  document.getElementById('result').classList.remove('on');
  tags = rollTags(); sel = new Set(); busy = false;
  refreshLeft = 3;
  document.getElementById('refresh').disabled = false;
  document.getElementById('rfTxt').textContent = '3/3';
  renderTags();
  tone(680,.09,'sine',.024);
  window.scrollTo(0,0);
};

/* ══════ 复制 ══════ */
async function copyText(txt, tip){
  try{ await navigator.clipboard.writeText(txt); }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  const t = document.getElementById('toast');
  t.textContent = tip || '已复制';
  t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 1300);
  tone(1100,.08,'sine',.024);
}
document.getElementById('copy').onclick = ()=> copyText(
  document.getElementById('copy').dataset.txt + '\n铁道动漫社 · 云龙西 招新', '战绩已复制');
document.getElementById('copyid').onclick = ()=> copyText('744922548', '群号已复制');

/* ══════ 启动 ══════ */
tags = rollTags();
renderTags();
drawTime();
</script>
